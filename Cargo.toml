[package]
name = "sidefeed"
version = "0.1.0"
edition = "2021"
authors = ["Swarnim Arun <swarnimarun11@gmail.com>"]
license = "MIT"
description = "A lightweight, cooperative feed aggregation service"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
burn = { version = "0.18", default-features = false, features = ["ndarray"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["chrono", "migrate", "runtime-tokio", "sqlite", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[features]
default = []
burn-local = ["dep:burn"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
