<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="sidefeed reader">
  <meta name="color-scheme" content="dark">
  <title>sidefeed</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="bar">
    <span class="wordmark">sidefeed</span>
    <nav class="pane-toggles" aria-label="fold panes">
      <button class="icon-btn" id="toggle-feeds" type="button" aria-pressed="true" aria-label="fold feeds pane" title="fold feeds pane">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg>
      </button>
      <button class="icon-btn" id="toggle-items" type="button" aria-pressed="true" aria-label="fold items pane" title="fold items pane">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M5.5 2.5v11M10.5 2.5v11"/></svg>
      </button>
      <button class="icon-btn" id="toggle-article" type="button" aria-pressed="true" aria-label="fold article pane" title="fold article pane">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></svg>
      </button>
    </nav>
    <nav class="bar-links"><a href="/docs">docs</a></nav>
  </header>

  <main class="layout">
    <aside class="pane sidebar" id="pane-feeds">
      <button class="rail" type="button" data-rail="feeds" title="unfold feeds pane">feeds</button>
      <ul class="feeds" id="feeds"></ul>
      <p class="note" id="feeds-note" hidden>
        No public feeds yet. Add one through the <a href="/docs">API</a> and mark it public.
      </p>
    </aside>

    <section class="pane list" id="pane-items" aria-label="items">
      <button class="rail" type="button" data-rail="items" title="unfold items pane">items</button>
      <header class="list-bar">
        <button class="back" id="back" type="button" aria-label="back to items">←</button>
        <div class="list-id">
          <h1 id="feed-title">feeds</h1>
          <p id="feed-sub"></p>
        </div>
        <div class="list-links" id="feed-links"></div>
      </header>
      <ol class="items" id="items"></ol>
      <p class="note" id="items-note" hidden></p>
    </section>

    <section class="pane reader" id="pane-article" aria-live="polite">
      <button class="rail" type="button" data-rail="article" title="unfold article pane">article</button>
      <article id="article"><p class="note">select an item.</p></article>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
